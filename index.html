<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>memotix receipt photobooth</title>

  <link rel="stylesheet" href="style.css" />

  <!-- QR CODE -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>

<body>

  <!-- FULLSCREEN -->

  <button id="fullscreenBtn">
    ⛶
  </button>

  <!-- =========================
       COVER PAGE
  ========================== -->

  <section id="cover" class="page active">

    <!-- GRID -->

    <div class="grid-bg"></div>

    <!-- PAPER -->

    <div class="paper-top"></div>

    <div class="paper-bottom"></div>

    <!-- CAMERA -->

    <img
      src="https://cdn-icons-png.flaticon.com/512/2920/2920244.png"
      class="camera-icon"
    />

    <!-- CONTENT -->

    <div class="cover-content">

      <p class="small-title">
        RECEIPT
      </p>

      <h1>
        PHOTOBOOTH
      </h1>

      <button id="startBtn">
        START
      </button>

    </div>

  </section>

  <!-- =========================
       TEMPLATE PAGE
  ========================== -->

  <section id="templatePage" class="page">

    <div class="template-header">

      <h2>
        Pilih Frame Foto
      </h2>

      <p>
        Pilih desain frame yang kamu sukai untuk memulai
      </p>

    </div>

    <div class="templates">

      <!-- TEMPLATE 1 -->

      <div
        class="template-card"
        data-shots="1"
      >

        <img
          src="assets/templates/temp1.png"
        />

        <h3>1 Foto</h3>

        <span>1 Pose</span>

      </div>

      <!-- TEMPLATE 2 -->

      <div
        class="template-card"
        data-shots="2"
      >

        <img
          src="assets/templates/temp2.png"
        />

        <h3>2 Foto</h3>

        <span>2 Pose</span>

      </div>

      <!-- TEMPLATE 3 -->

      <div
        class="template-card"
        data-shots="2"
      >

        <img
          src="assets/templates/temp3.png"
        />

        <h3>2R 2 Shot</h3>

        <span>2 Pose</span>

      </div>

      <!-- TEMPLATE 4 -->

      <div
        class="template-card"
        data-shots="3"
      >

        <img
          src="assets/templates/temp4.png"
        />

        <h3>2R 3 Shot</h3>

        <span>3 Pose</span>

      </div>

      <!-- TEMPLATE 5 -->

      <div
        class="template-card"
        data-shots="1"
      >

        <img
          src="assets/templates/temp5.png"
        />

        <h3>2R One Shot</h3>

        <span>1 Pose</span>

      </div>

      <!-- TEMPLATE 6 -->

      <div
        class="template-card"
        data-shots="6"
      >

        <img
          src="assets/templates/temp6.png"
        />

        <h3>Twin</h3>

        <span>3 Pose</span>

      </div>

      <!-- TEMPLATE 7 -->

      <div
        class="template-card"
        data-shots="1"
      >

        <div class="empty-frame">

          🖼️

        </div>

        <h3>Tanpa Frame</h3>

        <span>Layout Polos</span>

      </div>

    </div>

  </section>

  <!-- =========================
       CAMERA PAGE
  ========================== -->

  <section id="cameraPage" class="page">

    <h2>
      Take Your Photo
    </h2>

    <video
      id="video"
      autoplay
      playsinline
    ></video>

    <button id="captureBtn">
      Capture
    </button>

  </section>

  <!-- =========================
       EDIT PAGE
  ========================== -->

  <section id="editPage" class="page">

    <h2>
      Edit Your Photo
    </h2>

    <canvas id="canvas"></canvas>

    <!-- FILTERS -->

    <div class="filters">

      <button data-filter="none">
        Normal
      </button>

      <button data-filter="grayscale(1)">
        Noir
      </button>

      <button data-filter="sepia(0.8)">
        Warm
      </button>

      <button data-filter="contrast(1.4)">
        Dark
      </button>

    </div>

    <!-- STICKERS -->

    <div class="stickers">

      <img
        src="assets/stickers/star.png"
        class="sticker"
      />

      <img
        src="assets/stickers/heart.png"
        class="sticker"
      />

      <img
        src="assets/stickers/y2k.png"
        class="sticker"
      />

      <img
        src="assets/stickers/smile.png"
        class="sticker"
      />

    </div>

    <button id="nextBtn">
      Next Step
    </button>

  </section>

  <!-- =========================
       RESULT PAGE
  ========================== -->

  <section id="resultPage" class="page">

    <h2>
      Your Receipt
    </h2>

    <canvas id="finalCanvas"></canvas>

    <a
      id="downloadBtn"
      download="memotix-photo.png"
    >
      Download Photo
    </a>

    <div id="qrcode"></div>

  </section>

  <script src="script.js"></script>

</body>
</html>
