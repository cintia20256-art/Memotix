<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Memotix Photobooth</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>

<body>

  <!-- SETTINGS BUTTON -->

  <button id="settingsBtn">
    ⚙️
  </button>

  <!-- FULLSCREEN -->

  <button id="fullscreenBtn">
    ⛶
  </button>

  <!-- SETTINGS PANEL -->

  <div id="settingsPanel">

    <h2>Settings</h2>

    <div class="setting-group">

      <label>Upload Cover Background</label>

      <input
        type="file"
        id="coverUpload"
        accept="image/*"
      >

    </div>

    <div class="setting-group">

      <label>Add Template</label>

      <input
        type="file"
        id="templateUpload"
        accept="image/*"
      >

    </div>

    <div class="setting-group">

      <label>Add Sticker</label>

      <input
        type="file"
        id="stickerUpload"
        accept="image/*"
      >

    </div>

  </div>

  <!-- COVER -->

  <section
    id="cover"
    class="page active"
  >

    <div class="grid-bg"></div>

    <div class="paper-top"></div>

    <div class="paper-bottom"></div>

    <div class="cover-overlay"></div>

    <img
      src="https://cdn-icons-png.flaticon.com/512/2920/2920244.png"
      class="camera-icon"
    >

    <div class="cover-content">

      <p class="small-title">
        MEMOTIX
      </p>

      <h1>
        PHOTOBOOTH
      </h1>

      <button id="startBtn">
        START
      </button>

    </div>

  </section>

  <!-- TEMPLATE -->

  <section
    id="templatePage"
    class="page"
  >

    <h2 class="title">
      Choose Template
    </h2>

    <div
      class="templates"
      id="templatesContainer"
    >

      <div
        class="template-card"
        data-template="1"
      >

        <img src="assets/templates/temp1.png">

        <p>Classic</p>

      </div>

      <div
        class="template-card"
        data-template="2"
      >

        <img src="assets/templates/temp2.png">

        <p>Twin</p>

      </div>

    </div>

  </section>

  <!-- CAMERA -->

  <section
    id="cameraPage"
    class="page"
  >

    <h2 class="title">
      Take Photo
    </h2>

    <video
      id="video"
      autoplay
      playsinline
    ></video>

    <button id="captureBtn">
      Capture
    </button>

  </section>

  <!-- EDIT -->

  <section
    id="editPage"
    class="page"
  >

    <h2 class="title">
      Edit Photo
    </h2>

    <canvas id="canvas"></canvas>

    <div class="filters">

      <button data-filter="none">
        Normal
      </button>

      <button data-filter="grayscale(1)">
        Noir
      </button>

      <button data-filter="sepia(1)">
        Warm
      </button>

    </div>

    <div
      class="stickers"
      id="stickersContainer"
    >

      <img
        src="assets/stickers/star.png"
        class="sticker"
      >

    </div>

    <button id="nextBtn">
      Finish
    </button>

  </section>

  <!-- RESULT -->

  <section
    id="resultPage"
    class="page"
  >

    <h2 class="title">
      Your Receipt
    </h2>

    <canvas id="finalCanvas"></canvas>

    <a
      id="downloadBtn"
      download="memotix.png"
    >
      Download
    </a>

    <div id="qrcode"></div>

  </section>

  <script src="script.js"></script>

</body>
</html>
